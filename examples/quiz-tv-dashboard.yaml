# ──────────────────────────────────────────────────────────────────────────────
# RH Quiz — TV / Large-Screen Dashboard
# ──────────────────────────────────────────────────────────────────────────────
# Import this file as a Lovelace dashboard (raw YAML mode) or paste it into a
# new view. It is designed to fill a 1080p / 4K screen such as a TV or a large
# monitor used at a quiz show.
#
# Layout (three-column):
#
#   ┌─────────────────────────────────────────────────────────────┐
#   │  Round Info bar  (current round name • round counter)       │
#   ├──────────────────────┬──────────────────┬───────────────────┤
#   │  Current Leader      │  This Round      │  Overall          │
#   │  (hero photo card)   │  Leaderboard     │  Standings        │
#   └──────────────────────┴──────────────────┴───────────────────┘
#
# Prerequisites
# ─────────────
# • raven_house_tools custom component installed and configured with players.
# • At least one player with a nickname (alias) and optionally a photo set via
#   the Update Player Alias / Update Player Photo services.
# • Quiz rounds configured via the RH Quiz Round Card or set_quiz_rounds service.
#
# Customisation tips
# ──────────────────
# • Adjust `photo_size` (default 36) on the leaderboard sections for bigger
#   avatars — try 48 or 56 on a TV.
# • Set `winner_score: overall` to show the score BEFORE the current round
#   (useful to build suspense while a round is in progress).
# • Set `show_round_info: false` on any card to hide the round info banner.
# • Point `show_winner: false` / `show_leaderboard: false` to turn off sections.
# ──────────────────────────────────────────────────────────────────────────────

title: Quiz Night
views:
  - title: Live Scores
    path: quiz-live
    # 'panel' stretches the top-level card to fill the full viewport height/width.
    panel: true
    cards:
      - type: vertical-stack
        cards:

          # ── Round Info Banner ────────────────────────────────────────────────
          # Shows the active round name, round counter, and the name of the next
          # round. Uses the rh-quiz-card with all sections except round-info
          # disabled so only the banner renders.
          - type: custom:rh-quiz-card
            title: ""
            show_round_info: true
            show_winner: false
            show_leaderboard: false
            show_round_leaderboard: false

          # ── Three-column score section ───────────────────────────────────────
          - type: horizontal-stack
            cards:

              # Left: Current Leader (hero card)
              # Uses a large photo hero and shows the player with the highest
              # total score so far. Set winner_score: overall to freeze the
              # standings mid-round.
              - type: custom:rh-quiz-card
                title: ""
                show_round_info: false
                show_winner: true
                show_leaderboard: false
                show_round_leaderboard: false
                winner_score: total
                photo_size: 56

              # Centre: This Round
              # Rankings for the round currently in progress.
              - type: custom:rh-quiz-card
                title: This Round
                show_round_info: false
                show_winner: false
                show_leaderboard: false
                show_round_leaderboard: true
                photo_size: 48

              # Right: Overall Standings
              # Cumulative totals across all completed and in-progress rounds.
              - type: custom:rh-quiz-card
                title: Overall Standings
                show_round_info: false
                show_winner: false
                show_leaderboard: true
                show_round_leaderboard: false
                winner_score: total
                leaderboard_score: total
                photo_size: 48
